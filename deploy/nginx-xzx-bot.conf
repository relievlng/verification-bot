# nginx reverse proxy for the XZX bot web server (Stripe webhook, /api/activate,
# file downloads). Put this at /etc/nginx/sites-available/xzx-bot, symlink it into
# sites-enabled, then run certbot to add HTTPS (see deploy/MIGRATION.md).
#
# Replace api.xzxsuite.com with your real domain/subdomain everywhere below.

server {
    listen 80;
    listen [::]:80;
    server_name api.xzxsuite.com;

    # Let certbot add the HTTPS (443) server block and the redirect:
    #   sudo certbot --nginx -d api.xzxsuite.com
    # After that, this block becomes the HTTP->HTTPS redirect automatically.

    # Big product downloads stream straight through from the bot.
    client_max_body_size 25m;          # webhooks/API are tiny; headroom for safety

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stripe verifies the signature against the exact raw body - don't let
        # nginx rewrite or chunk it.
        proxy_request_buffering off;

        # Large file downloads: stream, don't buffer to disk, and allow slow links.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
